<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="HTML form">
    <meta name="keywords" content="HTML">
    <meta name="author" content="Nguonnyny Tan">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
    <a href="http://www.swin.edu.au">
        <img src="logo.png" alt="swinburne logo">
    </a>
    <h1>CWA Help Desk Appointment</h1>
    <p>
        The help desk is located in ATC 620. Open 10:30 to 19:00 Monday to Friday.
        Check Blackboard for when CWA tutors will be there.
    </p>

    <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
        <fieldset>
            <legend>Student Details</legend>
            <p>
                <label for="studentID">Student ID</label>
                <input type="text" name="studentID" id="studentID" required
                pattern="[0-9]{7,10}">
            </p>
            <p>
                <label for="name">Given Name</label>
                <input type="text" name="name" id="name" required
                pattern="^[A-Za-z]{1,15}$" maxlength="15">
                <label for="famName">Family Name</label>
                <input type="text" name="famName" id="famName" required
                pattern="^[a-zA-Z]{1,15}$" maxlength="15">
            </p>
        </fieldset>
        <fieldset>
            <legend>Your Unit</legend>
            <p>
                <input type="radio" name="unit" id="cos10011" required>
                <label for="cos10011">COS10011</label>
                <input type="radio" name="unit" id="cos60004">
                <label for="cos60004">COS60004</label>
                <input type="radio" name="unit" id="cos60007">
                <label for="cos60007">COS60007</label>
            </p>
            <p>
                <label for="tutor">Your Tutor</label>
                <select name="tutor" id="tutor" required>
                    <option value="" selected>Please Select</option>
                    <option value="bo">Bo Li</option>
                    <option value="xin">Xinjian Zhang</option>
                    <option value="ed">Ed Greenaway</option>
                    <option value="meng">Mengjiao Guo</option>
                </select>
            </p>
        </fieldset>
        <fieldset>
            <legend>Issue</legend>
            <p>
                <label for="html">HTML</label>
                <input type="checkbox" name="issue[]" id="html" value="html" checked>
                <label for="css">CSS</label>
                <input type="checkbox" name="issue[]" id="css" value="css">
                <label for="js">JavaScript</label>
                <input type="checkbox" name="issue[]" id="js" value="js">
                <label for="php">PHP</label>
                <input type="checkbox" name="issue[]" id="php" value="php">
                <label for="sql">MySQL</label>
                <input type="checkbox" name="issue[]" id="sql" value="sql">
            </p>
            <p>
                <label for="des">Description of Issue</label>
                <textarea name="des" id="des" rows="5" cols="40" 
                placeholder="Write description of your problem here ..."></textarea>
            </p>
        </fieldset>
        <fieldset>
            <legend>Preferred Date/Time</legend>
            <p>
                <label for="date">Date</label>
                <input type="text" name="date" id="date" placeholder="dd/mm/yyyy"
                pattern="^[0-9]{2}/[0-9]{2}/[0-9]{4}$">
            </p>
            <p>
                <label for="time">Time</label>
                <input type="text" name="time" id="time" placeholder="00:00"
                pattern="^[0-9]{2}:[0-9]{2}$">
            </p>
        </fieldset>
        <input type="submit" value="Book">
        <input type="reset" value="Reset form">
    </form>
</body>
</html>
